version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: ecommerce_postgres

    restart: always

    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:

    build: .

    container_name: ecommerce_etl

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports

volumes:

  postgres_data: