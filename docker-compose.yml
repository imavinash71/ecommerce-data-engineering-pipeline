version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow

  working_dir: /opt/airflow/project

  user: "${AIRFLOW_UID:-50000}:0"

  restart: unless-stopped

  environment:
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/ecommerce_db
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  volumes:
    - ./src:/opt/airflow/project/src
    - ./run_pipeline.py:/opt/airflow/project/run_pipeline.py
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins

  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16

    container_name: ecommerce_postgres

    restart: always

    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common

    container_name: airflow_init

    restart: "no"

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Avinash
      --lastname Chavhan
      --role Admin
      --email admin@example.com
      "

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow_webserver

    command: webserver

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow_scheduler

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data: